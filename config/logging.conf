[loggers]
keys=root
[handlers]
keys=console,file
[formatters]
keys=readable
[logger_root]
level=INFO
handlers=console,file
[handler_console]
class=StreamHandler
level=INFO
formatter=readable
args=(sys.stderr,)
[handler_file]
class=FileHandler
level=INFO
formatter=readable
args=('logs/controller.log', 'a')
[formatter_readable]
format=%(asctime)s %(levelname)s %(name)s %(message)s
datefmt=%Y-%m-%dT%H:%M:%S
